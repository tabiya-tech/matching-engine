swagger: '2.0'

info:
  description: Matching API __ENVIRONMENT__
  title: Matching API __ENVIRONMENT__
  version: 1.0.0

x-google-backend:
  address: __CLOUD_RUN_URL__
  deadline: 300

schemes:
  - https

produces:
  - application/json

consumes:
  - application/json

securityDefinitions:
  gcp_api_key:
    type: apiKey
    name: "x-api-key"
    in: "header"
    description: "Google Cloud API key for authentication"

x-google-management:
  metrics:
    - name: "request-metric"
      displayName: "API Request Counter"
      valueType: INT64
      metricKind: DELTA
      description: "Counts the number of API requests"
  quota:
    limits:
      - name: "request-limit"
        metric: "request-metric"
        unit: "1/min/{project}"
        values:
          STANDARD: 12000

paths:
  '/docs':
    get:
      summary: Docs endpoint
      operationId: api_docs
      responses:
        '200':
          description: Docs page
          schema:
            type: string
  '/openapi.json':
    get:
      summary: OAS file
      operationId: oas_file
      responses:
        '200':
          description: OAS file
          schema:
            type: string
  '/health':
    get:
      summary: Get Health of the service
      operationId: get_health
      responses:
        '200':
          description: Status of the application
          schema:
            type: string
  '/jobs':
    get:
      description: Browse active jobs with cursor-based pagination. Reads from the same data source as matched jobs.
      operationId: list_jobs
      parameters:
        - name: cursor
          in: query
          required: false
          type: string
          description: Opaque pagination cursor returned as next_cursor by the previous response. Omit for the first page.
        - name: limit
          in: query
          required: false
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: Page size (1-100). Default 20.
      responses:
        '200':
          description: A page of jobs (items + next_cursor)
        '400':
          description: Bad Request - invalid cursor
        '429':
          description: Too Many Requests - rate limit exceeded
        '500':
          description: Internal Server Error
      summary: Browse jobs
      tags:
        - Jobs
      x-google-quota:
        metricCosts:
          request-metric: 1
      security:
        - gcp_api_key: []
    options:
      description: CORS preflight for /jobs
      operationId: jobs_options
      responses:
        '200':
          description: Success
      tags:
        - Jobs
      x-google-quota:
        metricCosts:
          request-metric: 1
  '/jobs/stats':
    get:
      description: Get the stats of different jobs
      operationId: list_jobs_stats
      responses:
        '200':
          description: Stats of jobs
      summary: Browse jobs stats
      tags:
        - Jobs
      x-google-quota:
        metricCosts:
          request-metric: 1
      security:
        - gcp_api_key: []
    options:
      description: CORS preflight for /jobs/stats
      operationId: jobs_stats_options
      responses:
        '200':
          description: Success
      tags:
        - Jobs
      x-google-quota:
        metricCosts:
          request-metric: 1
  '/match':
    post:
      description: >-
        Match one or many users against job opportunities and occupations, and suggest skill gaps.
        Body is a JSON array of MatchRequest (one object per user); the response is an array of
        MatchResponse in the same order. Full field reference in the service's /docs.
      operationId: match
      parameters:
        - name: body
          in: body
          required: true
          description: JSON array of MatchRequest (one object per user).
          schema:
            type: array
            items:
              type: object
        - name: retrieve_top_k
          in: query
          required: false
          type: integer
          minimum: 1
          maximum: 500
          description: Stage-1 shortlist size per user before cross-encoder rerank.
        - name: final_top_k
          in: query
          required: false
          type: integer
          minimum: 1
          maximum: 200
          description: Maximum number of opportunities returned per user.
        - name: final_score_combiner
          in: query
          required: false
          type: string
          enum: [product, geometric_mean]
          description: How final_score combines u_hat and p_hat.
        - name: skill_gap_top_k
          in: query
          required: false
          type: integer
          minimum: 1
          maximum: 50
          description: Number of skill-gap recommendations per user.
      responses:
        '200':
          description: Array of MatchResponse, one per user
        '400':
          description: Bad Request - empty body, too many users, or invalid final_score_combiner
        '401':
          description: Unauthorized - missing or invalid API key
        '403':
          description: Forbidden - missing x-api-key header
        '422':
          description: Unprocessable Entity - request body failed validation
        '429':
          description: Too Many Requests - rate limit exceeded
        '500':
          description: Internal Server Error
      summary: Match users to opportunities, occupations and skill gaps
      tags:
        - Matching
      x-google-quota:
        metricCosts:
          request-metric: 1
      security:
        - gcp_api_key: []
    options:
      description: CORS preflight for /match
      operationId: match_options
      responses:
        '200':
          description: Success
      tags:
        - Matching
      x-google-quota:
        metricCosts:
          request-metric: 1
