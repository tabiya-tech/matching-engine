name: Backend CI

on:
  workflow_call:

jobs:
  lint-format-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        shell: bash
        run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Lint (ruff)
        shell: bash
        run: python tests/sanity_checks/lint_check.py
        working-directory: backend

      - name: Check formatting (ruff format)
        shell: bash
        run: python tests/sanity_checks/formatter_check.py
        working-directory: backend

      - name: Type check (pyright, strict)
        shell: bash
        run: python tests/sanity_checks/type_check.py
        working-directory: backend
