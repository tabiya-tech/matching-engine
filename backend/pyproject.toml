[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "ANN401"]
ignore = ["B008"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.pyright]
exclude = ["venv", "**/__pycache__"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
reportMissingImports = true
